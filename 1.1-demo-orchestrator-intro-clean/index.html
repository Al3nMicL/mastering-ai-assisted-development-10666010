<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Fish Bowl Simulation</title>
  <style>
    :root {
      color-scheme: dark;
      --panel-bg: rgba(9, 20, 28, 0.72);
      --panel-border: rgba(180, 231, 242, 0.2);
      --text: #f4fbff;
      --muted: #a6c5c4;
      --accent: #73d4cf;
      --accent-warm: #ffc56f;
      --danger: #f88b7a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #061017;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      top: 18px;
      left: 18px;
      width: min(360px, calc(100vw - 36px));
      padding: 14px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
      user-select: none;
    }

    .hud__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 720;
      letter-spacing: 0;
    }

    .stats {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
    }

    .stat {
      min-width: 48px;
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
      text-transform: uppercase;
    }

    .count {
      color: var(--accent-warm);
      font-size: 1rem;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      height: 24px;
      margin: 0 0 10px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .toggles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .toggle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 720;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .toggle:has(input:checked) {
      border-color: rgba(115, 212, 207, 0.58);
      background: rgba(115, 212, 207, 0.18);
      color: #dcfffb;
    }

    .hint {
      margin: 10px 0 0;
      color: rgba(244, 251, 255, 0.68);
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(320px, calc(100vw - 36px));
      padding: 10px 12px;
      border: 1px solid rgba(255, 197, 111, 0.26);
      border-radius: 8px;
      background: rgba(20, 15, 9, 0.68);
      color: rgba(255, 245, 229, 0.86);
      font-size: 0.78rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 220ms ease, transform 220ms ease;
      pointer-events: none;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 560px) {
      .hud {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        padding: 12px;
      }

      .hud__top {
        align-items: flex-start;
      }

      .toggles {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Interactive Three.js fish bowl simulation">
    <section class="hud" aria-label="Simulation controls">
      <div class="hud__top">
        <h1>Glass Fish Bowl</h1>
        <div class="stats" aria-live="polite">
          <span class="stat"><span id="fps">60</span> fps</span>
          <span class="stat"><span id="bubbleCount">0</span> bub</span>
        </div>
      </div>

      <label for="fishCount">
        Fish Count
        <span class="count" id="countValue">24</span>
      </label>
      <input id="fishCount" type="range" min="1" max="50" value="24">

      <div class="toggles">
        <label class="toggle"><input id="causticsToggle" type="checkbox" checked>Caustics</label>
        <label class="toggle"><input id="bubblesToggle" type="checkbox" checked>Bubbles</label>
        <label class="toggle"><input id="trailsToggle" type="checkbox">Trails</label>
      </div>

      <p class="hint">Click the bowl to drop food and pull nearby fish into a little feeding swirl.</p>
    </section>
    <div class="toast" id="toast">Food dropped</div>
  </main>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const MAX_FISH = 50;
    const MAX_BUBBLES = 420;
    const BOWL_RADIUS = 3.1;
    const WATER_RADIUS = 2.78;
    const ACTIVE_START = 24;
    const FISH_NEIGHBOR_RADIUS = 1.08;
    const tmpObject = new THREE.Object3D();
    const tmpMatrix = new THREE.Matrix4();
    const tmpQuaternion = new THREE.Quaternion();
    const tmpScale = new THREE.Vector3();
    const tmpUp = new THREE.Vector3(0, 1, 0);
    const tmpForward = new THREE.Vector3(1, 0, 0);

    const controls = {
      fishCount: ACTIVE_START,
      caustics: true,
      bubbles: true,
      trails: false
    };

    const ui = {
      slider: document.getElementById("fishCount"),
      count: document.getElementById("countValue"),
      fps: document.getElementById("fps"),
      bubbleCount: document.getElementById("bubbleCount"),
      caustics: document.getElementById("causticsToggle"),
      bubbles: document.getElementById("bubblesToggle"),
      trails: document.getElementById("trailsToggle"),
      toast: document.getElementById("toast")
    };

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x102633, 0.036);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.9, 9.2);
    camera.lookAt(0, 0.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x061017, 1);
    document.body.appendChild(renderer.domElement);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const clickPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const clickPoint = new THREE.Vector3();
    const clock = new THREE.Clock();

    const bowlGroup = new THREE.Group();
    scene.add(bowlGroup);

    const ambient = new THREE.HemisphereLight(0xb8f6ff, 0x66503b, 1.8);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffd29b, 2.2);
    key.position.set(-3.5, 6.5, 5.5);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 16;
    key.shadow.camera.left = -6;
    key.shadow.camera.right = 6;
    key.shadow.camera.top = 6;
    key.shadow.camera.bottom = -6;
    scene.add(key);

    const back = new THREE.PointLight(0x74d8ff, 1.7, 14);
    back.position.set(3.4, 3.1, -3.8);
    scene.add(back);

    const warmFill = new THREE.PointLight(0xffa85f, 0.9, 12);
    warmFill.position.set(-4, 0.4, 3);
    scene.add(warmFill);

    buildBackdrop();
    buildBowl();
    const { causticTexture, causticsMesh } = buildSubstrateAndCaustics();
    buildPlantsAndRocks();

    const fish = createFishSchool();
    const bubbles = createBubblePool();
    const food = createFood();
    const trails = createTrails();

    ui.slider.addEventListener("input", () => {
      controls.fishCount = Number(ui.slider.value);
      ui.count.textContent = controls.fishCount;
    });

    ui.caustics.addEventListener("change", () => {
      controls.caustics = ui.caustics.checked;
      causticsMesh.visible = controls.caustics;
    });

    ui.bubbles.addEventListener("change", () => {
      controls.bubbles = ui.bubbles.checked;
    });

    ui.trails.addEventListener("change", () => {
      controls.trails = ui.trails.checked;
      trails.group.visible = controls.trails;
    });

    window.addEventListener("resize", resize);
    renderer.domElement.addEventListener("pointerdown", feedFish);

    function buildBackdrop() {
      const canvas = document.createElement("canvas");
      canvas.width = 16;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#25415b");
      gradient.addColorStop(0.34, "#113847");
      gradient.addColorStop(0.62, "#16312e");
      gradient.addColorStop(1, "#14100f");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const geometry = new THREE.SphereGeometry(36, 32, 16);
      const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(12, 96),
        new THREE.MeshStandardMaterial({ color: 0x30251d, roughness: 0.88, metalness: 0.02 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -3.05;
      floor.receiveShadow = true;
      scene.add(floor);
    }

    function buildBowl() {
      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xd9fbff,
        roughness: 0.05,
        metalness: 0,
        transmission: 0.45,
        thickness: 0.25,
        transparent: true,
        opacity: 0.24,
        ior: 1.23,
        envMapIntensity: 1.6,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const glass = new THREE.Mesh(new THREE.SphereGeometry(BOWL_RADIUS, 72, 36, 0, Math.PI * 2, 0.42, Math.PI - 0.7), glassMaterial);
      glass.position.y = -0.25;
      glass.castShadow = true;
      glass.receiveShadow = true;
      bowlGroup.add(glass);

      const waterMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x77cbd8,
        roughness: 0.18,
        metalness: 0,
        transmission: 0.28,
        transparent: true,
        opacity: 0.38,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const water = new THREE.Mesh(new THREE.SphereGeometry(WATER_RADIUS, 72, 24, 0, Math.PI * 2, 0.56, Math.PI - 0.88), waterMaterial);
      water.name = "waterBody";
      water.position.y = -0.42;
      bowlGroup.add(water);

      const surface = new THREE.Mesh(
        new THREE.CircleGeometry(WATER_RADIUS * 0.91, 96),
        new THREE.MeshPhysicalMaterial({
          color: 0xb6fbff,
          roughness: 0.06,
          transmission: 0.34,
          transparent: true,
          opacity: 0.34,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );
      surface.name = "waterSurface";
      surface.rotation.x = -Math.PI / 2;
      surface.position.y = 1.54;
      bowlGroup.add(surface);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(WATER_RADIUS * 0.94, 0.032, 12, 128),
        new THREE.MeshStandardMaterial({
          color: 0xedffff,
          emissive: 0x8de7ff,
          emissiveIntensity: 0.24,
          roughness: 0.12,
          transparent: true,
          opacity: 0.72
        })
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 1.55;
      bowlGroup.add(rim);

      const base = new THREE.Mesh(
        new THREE.TorusGeometry(1.78, 0.055, 12, 128),
        new THREE.MeshStandardMaterial({ color: 0xd2f4ff, roughness: 0.14, metalness: 0.04, transparent: true, opacity: 0.48 })
      );
      base.rotation.x = Math.PI / 2;
      base.position.y = -2.74;
      bowlGroup.add(base);
    }

    function buildSubstrateAndCaustics() {
      const sandCanvas = document.createElement("canvas");
      sandCanvas.width = 512;
      sandCanvas.height = 512;
      const sandCtx = sandCanvas.getContext("2d");
      sandCtx.fillStyle = "#b8945d";
      sandCtx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 1600; i++) {
        const shade = 110 + Math.floor(Math.random() * 78);
        sandCtx.fillStyle = `rgba(${shade + 30}, ${shade + 8}, ${shade - 22}, ${0.08 + Math.random() * 0.18})`;
        sandCtx.beginPath();
        sandCtx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 1.7 + 0.4, 0, Math.PI * 2);
        sandCtx.fill();
      }
      const sandTexture = new THREE.CanvasTexture(sandCanvas);
      sandTexture.wrapS = THREE.RepeatWrapping;
      sandTexture.wrapT = THREE.RepeatWrapping;
      sandTexture.repeat.set(2.2, 2.2);
      sandTexture.colorSpace = THREE.SRGBColorSpace;

      const substrate = new THREE.Mesh(
        new THREE.CircleGeometry(2.23, 96),
        new THREE.MeshStandardMaterial({ map: sandTexture, color: 0xe0b66f, roughness: 0.92 })
      );
      substrate.rotation.x = -Math.PI / 2;
      substrate.position.y = -2.14;
      substrate.receiveShadow = true;
      bowlGroup.add(substrate);

      const causticCanvas = document.createElement("canvas");
      causticCanvas.width = 512;
      causticCanvas.height = 512;
      const causticTexture = new THREE.CanvasTexture(causticCanvas);
      causticTexture.colorSpace = THREE.SRGBColorSpace;

      const causticsMesh = new THREE.Mesh(
        new THREE.CircleGeometry(2.18, 96),
        new THREE.MeshBasicMaterial({
          map: causticTexture,
          transparent: true,
          opacity: 0.46,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      causticsMesh.rotation.x = -Math.PI / 2;
      causticsMesh.position.y = -2.132;
      bowlGroup.add(causticsMesh);

      return { causticTexture, causticsMesh };
    }

    function buildPlantsAndRocks() {
      const plantMaterialA = new THREE.MeshStandardMaterial({ color: 0x2fb36f, roughness: 0.7, side: THREE.DoubleSide });
      const plantMaterialB = new THREE.MeshStandardMaterial({ color: 0x8ac95b, roughness: 0.72, side: THREE.DoubleSide });
      const stemGeometry = new THREE.ConeGeometry(0.045, 0.9, 5, 1);

      [
        { x: -1.55, z: -0.66, count: 7, color: plantMaterialA },
        { x: 1.48, z: -0.88, count: 6, color: plantMaterialB },
        { x: 0.5, z: 1.28, count: 5, color: plantMaterialA }
      ].forEach((cluster) => {
        for (let i = 0; i < cluster.count; i++) {
          const stem = new THREE.Mesh(stemGeometry, cluster.color);
          const angle = (i / cluster.count) * Math.PI * 2;
          stem.position.set(cluster.x + Math.cos(angle) * 0.12, -1.78 + Math.random() * 0.12, cluster.z + Math.sin(angle) * 0.12);
          stem.rotation.set(0.2 + Math.random() * 0.25, angle, 0.24 * Math.sin(angle));
          stem.scale.setScalar(0.82 + Math.random() * 0.5);
          stem.castShadow = true;
          bowlGroup.add(stem);
        }
      });

      const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x7b8077, roughness: 0.86 });
      for (let i = 0; i < 10; i++) {
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.14 + Math.random() * 0.13, 0), rockMaterial);
        const angle = Math.random() * Math.PI * 2;
        const radius = 0.4 + Math.random() * 1.55;
        rock.position.set(Math.cos(angle) * radius, -2.02 + Math.random() * 0.07, Math.sin(angle) * radius);
        rock.scale.set(1.2, 0.45 + Math.random() * 0.35, 0.8 + Math.random() * 0.7);
        rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        rock.castShadow = true;
        rock.receiveShadow = true;
        bowlGroup.add(rock);
      }
    }

    function createFishGeometry() {
      const vertices = new Float32Array([
        0.62, 0, 0, -0.18, 0.18, 0.16, -0.18, -0.18, 0.16,
        0.62, 0, 0, -0.18, -0.18, 0.16, -0.18, 0.18, -0.16,
        0.62, 0, 0, -0.18, 0.18, -0.16, -0.18, 0.18, 0.16,
        0.62, 0, 0, -0.18, -0.18, -0.16, -0.18, -0.18, 0.16,
        -0.18, 0.18, 0.16, -0.18, 0.18, -0.16, -0.18, -0.18, 0.16,
        -0.18, -0.18, 0.16, -0.18, 0.18, -0.16, -0.18, -0.18, -0.16,
        -0.18, 0, 0, -0.54, 0.22, 0, -0.54, -0.22, 0,
        -0.08, 0.08, 0, -0.32, 0.38, 0, -0.28, 0.03, 0,
        -0.08, -0.08, 0, -0.28, -0.03, 0, -0.32, -0.34, 0
      ]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
      geometry.computeVertexNormals();
      return geometry;
    }

    function createFishSchool() {
      const geometry = createFishGeometry();
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.42,
        metalness: 0.05,
        flatShading: true,
        vertexColors: true
      });
      const mesh = new THREE.InstancedMesh(geometry, material, MAX_FISH);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX_FISH * 3), 3);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      bowlGroup.add(mesh);

      const colors = [0xffa552, 0x78d7f2, 0xffdf6b, 0xff7f93, 0x83e2a9, 0xd29dff];
      const data = [];
      for (let i = 0; i < MAX_FISH; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.sqrt(Math.random()) * 1.8;
        const position = new THREE.Vector3(Math.cos(angle) * radius, -0.7 + Math.random() * 1.7, Math.sin(angle) * radius);
        const velocity = new THREE.Vector3(Math.cos(angle + Math.PI / 2), (Math.random() - 0.5) * 0.25, Math.sin(angle + Math.PI / 2)).normalize().multiplyScalar(0.38 + Math.random() * 0.35);
        const scale = 0.23 + Math.random() * 0.12;
        const color = new THREE.Color(colors[i % colors.length]).offsetHSL((Math.random() - 0.5) * 0.04, 0.06, (Math.random() - 0.5) * 0.08);
        mesh.setColorAt(i, color);
        data.push({
          position,
          velocity,
          acceleration: new THREE.Vector3(),
          scale,
          visibleScale: i < ACTIVE_START ? 1 : 0,
          phase: Math.random() * Math.PI * 2,
          burstTimer: Math.random() * 4,
          turnBias: new THREE.Vector3((Math.random() - 0.5) * 0.08, 0, (Math.random() - 0.5) * 0.08)
        });
      }
      mesh.instanceColor.needsUpdate = true;

      return { mesh, data };
    }

    function createBubblePool() {
      const geometry = new THREE.SphereGeometry(0.035, 8, 6);
      const material = new THREE.MeshStandardMaterial({
        color: 0xcdfdff,
        roughness: 0.02,
        metalness: 0,
        transparent: true,
        opacity: 0.46,
        emissive: 0x4bd8ff,
        emissiveIntensity: 0.08,
        depthWrite: false
      });
      const mesh = new THREE.InstancedMesh(geometry, material, MAX_BUBBLES);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      bowlGroup.add(mesh);

      const data = [];
      for (let i = 0; i < MAX_BUBBLES; i++) {
        data.push({ alive: false, life: 0, maxLife: 1, position: new THREE.Vector3(), velocity: new THREE.Vector3(), size: 0 });
      }
      return { mesh, data, cursor: 0, alive: 0 };
    }

    function createFood() {
      const group = new THREE.Group();
      const material = new THREE.MeshStandardMaterial({ color: 0xffd069, emissive: 0xff8d37, emissiveIntensity: 0.45, roughness: 0.5 });
      for (let i = 0; i < 18; i++) {
        const crumb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.025 + Math.random() * 0.018, 0), material);
        crumb.position.set((Math.random() - 0.5) * 0.32, (Math.random() - 0.5) * 0.14, (Math.random() - 0.5) * 0.32);
        group.add(crumb);
      }
      group.visible = false;
      bowlGroup.add(group);
      return { group, active: false, position: new THREE.Vector3(), timer: 0 };
    }

    function createTrails() {
      const group = new THREE.Group();
      group.visible = false;
      const lines = [];
      const material = new THREE.LineBasicMaterial({ color: 0xa9fbff, transparent: true, opacity: 0.25 });
      for (let i = 0; i < MAX_FISH; i++) {
        const geometry = new THREE.BufferGeometry();
        const points = new Float32Array(18);
        geometry.setAttribute("position", new THREE.BufferAttribute(points, 3));
        const line = new THREE.Line(geometry, material);
        group.add(line);
        lines.push({ line, history: Array.from({ length: 6 }, () => new THREE.Vector3()) });
      }
      bowlGroup.add(group);
      return { group, lines };
    }

    function feedFish(event) {
      const bounds = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      raycaster.ray.intersectPlane(clickPlane, clickPoint);

      const maxRadiusAtY = waterRadiusAtY(clickPoint.y);
      if (clickPoint.y < -1.85 || clickPoint.y > 1.38 || maxRadiusAtY <= 0.2) {
        clickPoint.set((Math.random() - 0.5) * 1.6, 0.7, (Math.random() - 0.5) * 1.6);
      }
      if (Math.hypot(clickPoint.x, clickPoint.z) > maxRadiusAtY) {
        const angle = Math.atan2(clickPoint.z, clickPoint.x);
        clickPoint.x = Math.cos(angle) * maxRadiusAtY * 0.78;
        clickPoint.z = Math.sin(angle) * maxRadiusAtY * 0.78;
      }

      food.active = true;
      food.timer = 6;
      food.position.copy(clickPoint);
      food.group.position.copy(clickPoint);
      food.group.visible = true;
      ui.toast.classList.add("is-visible");
      window.clearTimeout(feedFish.toastTimer);
      feedFish.toastTimer = window.setTimeout(() => ui.toast.classList.remove("is-visible"), 1200);
    }

    function updateFish(delta, elapsed) {
      const activeCount = controls.fishCount;
      const centerPull = new THREE.Vector3();
      const alignment = new THREE.Vector3();
      const cohesion = new THREE.Vector3();
      const separation = new THREE.Vector3();
      const foodPull = new THREE.Vector3();

      for (let i = 0; i < MAX_FISH; i++) {
        const f = fish.data[i];
        const isActive = i < activeCount;
        const scaleTarget = isActive ? 1 : 0;
        f.visibleScale += (scaleTarget - f.visibleScale) * Math.min(1, delta * 5.5);

        if (!isActive && f.visibleScale < 0.02) {
          writeHiddenInstance(fish.mesh, i);
          continue;
        }

        f.acceleration.set(0, 0, 0);

        if (isActive) {
          alignment.set(0, 0, 0);
          cohesion.set(0, 0, 0);
          separation.set(0, 0, 0);
          let neighbors = 0;

          for (let j = 0; j < activeCount; j++) {
            if (i === j) continue;
            const other = fish.data[j];
            const distance = f.position.distanceTo(other.position);
            if (distance > 0.0001 && distance < FISH_NEIGHBOR_RADIUS) {
              alignment.add(other.velocity);
              cohesion.add(other.position);
              separation.addScaledVector(f.position.clone().sub(other.position), 1 / Math.max(0.08, distance * distance));
              neighbors++;
            }
          }

          if (neighbors > 0) {
            alignment.divideScalar(neighbors).setLength(0.42).sub(f.velocity).multiplyScalar(0.55);
            cohesion.divideScalar(neighbors).sub(f.position).multiplyScalar(0.2);
            separation.multiplyScalar(0.33);
            f.acceleration.add(alignment).add(cohesion).add(separation);
          }

          centerPull.copy(f.position).multiplyScalar(-0.08);
          centerPull.y += Math.sin(elapsed * 1.2 + f.phase) * 0.035;
          f.acceleration.add(centerPull);

          const radiusLimit = waterRadiusAtY(f.position.y) - 0.25;
          const horizontalDistance = Math.hypot(f.position.x, f.position.z);
          if (horizontalDistance > radiusLimit) {
            f.acceleration.x += (-f.position.x / horizontalDistance) * 1.8;
            f.acceleration.z += (-f.position.z / horizontalDistance) * 1.8;
          }
          if (f.position.y > 1.18) f.acceleration.y -= 1.1;
          if (f.position.y < -1.78) f.acceleration.y += 1.1;

          f.burstTimer -= delta;
          if (f.burstTimer <= 0) {
            f.turnBias.set((Math.random() - 0.5) * 0.65, (Math.random() - 0.5) * 0.18, (Math.random() - 0.5) * 0.65);
            f.burstTimer = 1.6 + Math.random() * 5.2;
          }
          f.acceleration.addScaledVector(f.turnBias, 0.22);

          if (food.active) {
            const distanceToFood = f.position.distanceTo(food.position);
            if (distanceToFood < 2.25) {
              foodPull.copy(food.position).sub(f.position).multiplyScalar((2.25 - distanceToFood) * 0.44);
              foodPull.y += 0.05 * Math.sin(elapsed * 8 + i);
              f.acceleration.add(foodPull);
            }
          }

          f.velocity.addScaledVector(f.acceleration, delta);
          const targetSpeed = 0.46 + Math.sin(elapsed * 0.7 + f.phase) * 0.08;
          const speed = THREE.MathUtils.clamp(f.velocity.length(), 0.25, 1.15);
          f.velocity.setLength(THREE.MathUtils.lerp(speed, targetSpeed, delta * 0.7));
          f.position.addScaledVector(f.velocity, delta);
          confineToBowl(f.position, f.velocity);

          if (controls.bubbles && Math.random() < delta * (0.55 + f.velocity.length() * 0.32)) {
            spawnBubble(f.position, 0.55 + f.velocity.length() * 0.25);
          }
          if (controls.bubbles && f.position.y < -1.52 && Math.random() < delta * 0.62) {
            spawnBubble(new THREE.Vector3(f.position.x * 0.9, -1.96, f.position.z * 0.9), 1.1);
          }
        }

        updateFishInstance(i, f, elapsed);
      }

      fish.mesh.instanceMatrix.needsUpdate = true;
    }

    function updateFishInstance(index, f, elapsed) {
      tmpForward.copy(f.velocity).normalize();
      if (tmpForward.lengthSq() < 0.01) tmpForward.set(1, 0, 0);
      tmpQuaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), tmpForward);

      const waggle = Math.sin(elapsed * 8 + f.phase) * 0.08;
      tmpObject.position.copy(f.position);
      tmpObject.quaternion.copy(tmpQuaternion);
      tmpObject.rotateY(waggle);
      tmpObject.rotateZ(Math.sin(elapsed * 3 + f.phase) * 0.08);
      const s = f.scale * f.visibleScale;
      tmpObject.scale.set(s * (1 + Math.sin(elapsed * 9 + f.phase) * 0.04), s, s);
      tmpObject.updateMatrix();
      fish.mesh.setMatrixAt(index, tmpObject.matrix);
    }

    function writeHiddenInstance(mesh, index) {
      tmpObject.position.set(0, -100, 0);
      tmpObject.scale.setScalar(0.0001);
      tmpObject.updateMatrix();
      mesh.setMatrixAt(index, tmpObject.matrix);
    }

    function updateBubbles(delta, elapsed) {
      let alive = 0;
      for (let i = 0; i < MAX_BUBBLES; i++) {
        const b = bubbles.data[i];
        if (!b.alive) {
          writeHiddenInstance(bubbles.mesh, i);
          continue;
        }

        b.life -= delta;
        if (b.life <= 0 || b.position.y > 1.55) {
          b.alive = false;
          writeHiddenInstance(bubbles.mesh, i);
          continue;
        }

        b.velocity.x += Math.sin(elapsed * 2.2 + i) * delta * 0.035;
        b.velocity.z += Math.cos(elapsed * 1.8 + i * 0.7) * delta * 0.035;
        b.position.addScaledVector(b.velocity, delta);
        const fade = THREE.MathUtils.clamp(b.life / b.maxLife, 0, 1);
        const size = b.size * (0.55 + (1 - fade) * 0.7);
        tmpMatrix.compose(b.position, tmpQuaternion.identity(), tmpScale.setScalar(size));
        bubbles.mesh.setMatrixAt(i, tmpMatrix);
        alive++;
      }
      bubbles.alive = alive;
      bubbles.mesh.instanceMatrix.needsUpdate = true;
      ui.bubbleCount.textContent = alive;
    }

    function spawnBubble(position, intensity) {
      const b = bubbles.data[bubbles.cursor];
      b.alive = true;
      b.life = 1.6 + Math.random() * 2.4;
      b.maxLife = b.life;
      b.position.copy(position);
      b.position.x += (Math.random() - 0.5) * 0.16;
      b.position.y += (Math.random() - 0.5) * 0.08;
      b.position.z += (Math.random() - 0.5) * 0.16;
      b.velocity.set((Math.random() - 0.5) * 0.07, 0.28 + Math.random() * 0.42 * intensity, (Math.random() - 0.5) * 0.07);
      b.size = 0.55 + Math.random() * 0.8;
      bubbles.cursor = (bubbles.cursor + 1) % MAX_BUBBLES;
    }

    function updateFood(delta, elapsed) {
      if (!food.active) return;
      food.timer -= delta;
      food.position.y -= delta * 0.075;
      food.group.position.copy(food.position);
      food.group.rotation.y += delta * 0.9;
      food.group.rotation.x = Math.sin(elapsed * 2.4) * 0.14;
      food.group.scale.setScalar(THREE.MathUtils.clamp(food.timer / 0.8, 0, 1));
      if (food.timer <= 0 || food.position.y < -1.9) {
        food.active = false;
        food.group.visible = false;
      }
    }

    function updateTrails() {
      if (!controls.trails) return;
      for (let i = 0; i < MAX_FISH; i++) {
        const trail = trails.lines[i];
        const f = fish.data[i];
        trail.line.visible = i < controls.fishCount && f.visibleScale > 0.15;
        trail.history.pop();
        trail.history.unshift(f.position.clone());
        const attr = trail.line.geometry.attributes.position;
        for (let j = 0; j < trail.history.length; j++) {
          attr.setXYZ(j, trail.history[j].x, trail.history[j].y, trail.history[j].z);
        }
        attr.needsUpdate = true;
      }
    }

    function updateCaustics(texture, elapsed) {
      if (!controls.caustics) return;
      const canvas = texture.image;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = "source-over";
      const radial = ctx.createRadialGradient(256, 256, 30, 256, 256, 250);
      radial.addColorStop(0, "rgba(139, 248, 255, 0.28)");
      radial.addColorStop(1, "rgba(139, 248, 255, 0)");
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, 512, 512);

      ctx.globalCompositeOperation = "lighter";
      ctx.lineWidth = 2;
      for (let ring = 0; ring < 18; ring++) {
        const phase = elapsed * (0.65 + ring * 0.015) + ring * 0.8;
        ctx.strokeStyle = `rgba(220, 255, 247, ${0.036 + (ring % 4) * 0.007})`;
        ctx.beginPath();
        for (let a = 0; a <= Math.PI * 2 + 0.08; a += 0.08) {
          const radius = 40 + ring * 11 + Math.sin(a * 4 + phase) * 8 + Math.cos(a * 7 - phase * 1.4) * 4;
          const x = 256 + Math.cos(a) * radius;
          const y = 256 + Math.sin(a) * radius * 0.82;
          if (a === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      texture.needsUpdate = true;
    }

    function waterRadiusAtY(y) {
      const localY = y + 0.42;
      const radius = Math.sqrt(Math.max(0, WATER_RADIUS * WATER_RADIUS - localY * localY));
      return Math.min(radius, WATER_RADIUS * 0.92);
    }

    function confineToBowl(position, velocity) {
      const radiusLimit = waterRadiusAtY(position.y) - 0.12;
      const horizontalDistance = Math.hypot(position.x, position.z);
      if (horizontalDistance > radiusLimit) {
        const angle = Math.atan2(position.z, position.x);
        position.x = Math.cos(angle) * radiusLimit;
        position.z = Math.sin(angle) * radiusLimit;
        velocity.x *= -0.35;
        velocity.z *= -0.35;
      }
      if (position.y > 1.35) {
        position.y = 1.35;
        velocity.y *= -0.35;
      }
      if (position.y < -1.95) {
        position.y = -1.95;
        velocity.y = Math.abs(velocity.y) * 0.45;
      }
    }

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.033);
      const elapsed = clock.elapsedTime;

      updateFish(delta, elapsed);
      updateBubbles(delta, elapsed);
      updateFood(delta, elapsed);
      updateTrails();
      updateCaustics(causticTexture, elapsed);

      const water = bowlGroup.getObjectByName("waterBody");
      const surface = bowlGroup.getObjectByName("waterSurface");
      if (water) water.scale.set(1 + Math.sin(elapsed * 0.8) * 0.004, 1 + Math.cos(elapsed * 0.7) * 0.003, 1 + Math.sin(elapsed * 0.6) * 0.004);
      if (surface) {
        surface.rotation.z += delta * 0.045;
        surface.position.y = 1.54 + Math.sin(elapsed * 1.1) * 0.018;
      }

      key.intensity = 2.05 + Math.sin(elapsed * 0.18) * 0.28;
      back.intensity = 1.55 + Math.cos(elapsed * 0.16) * 0.22;

      renderer.render(scene, camera);
      updateFps(delta);
      requestAnimationFrame(animate);
    }

    let fpsAverage = 60;
    let fpsTimer = 0;
    function updateFps(delta) {
      const current = 1 / Math.max(delta, 0.001);
      fpsAverage = fpsAverage * 0.92 + current * 0.08;
      fpsTimer += delta;
      if (fpsTimer > 0.25) {
        ui.fps.textContent = String(Math.round(fpsAverage));
        fpsTimer = 0;
      }
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    animate();
  </script>
</body>
</html>
